server {
  listen       80;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;

  # Astro génère des URLs propres (/page/ -> /page/index.html)
  # `=404` (et non un fallback direct) pour que la page d'erreur soit servie
  # avec un vrai statut 404 via error_page, et non un 200 trompeur.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;

  # Assets fingerprintés par Astro : immuables
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /404.html {
    internal;
  }

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
