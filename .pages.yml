# Pages CMS — https://pagescms.org/docs
# Interface d'édition hébergée : on se connecte sur app.pagescms.org avec son
# compte GitHub, chaque enregistrement = un commit. Aucun serveur à maintenir.

media:
  input: public/uploads
  output: /uploads
  extensions: [jpg, jpeg, png, webp, avif, svg, pdf]

content:
  # ---------------------------------------------------------------- ACCUEIL
  - name: accueil
    label: Page d'accueil
    type: file
    path: src/data/home.json
    icon: home
    fields:
      - name: seo
        label: Référencement & partage
        type: object
        fields:
          - { name: titre, label: Titre de l'onglet, type: string }
          - { name: description, label: "Description (Google, réseaux)", type: text }
          - { name: image, label: Image de partage (1200×630), type: image }

      - name: hero
        label: Bandeau d'accueil
        type: object
        fields:
          - { name: surtitre, label: Surtitre (ex. Saison 2026-2027), type: string }
          - { name: titre, label: Grand titre, type: string }
          - { name: accroche, label: Accroche, type: text }
          - name: cta_principal
            label: Bouton principal
            type: object
            fields:
              - { name: libelle, label: Libellé, type: string }
              - { name: lien, label: Lien, type: string }
          - name: cta_secondaire
            label: Bouton secondaire
            type: object
            fields:
              - { name: libelle, label: Libellé, type: string }
              - { name: lien, label: Lien, type: string }
          - name: compte_a_rebours
            label: Compte à rebours
            type: object
            fields:
              - { name: actif, label: Afficher le compte à rebours, type: boolean }
              - { name: libelle, label: Nom de l'événement, type: string }
              - name: date
                label: Date et heure de départ
                type: date
                options: { time: true, format: "yyyy-MM-dd'T'HH:mm:ssxxx" }
              - { name: lien, label: "Lien (ex. /triathlon)", type: string }

      - name: chiffres
        label: Chiffres clés
        type: object
        list: { min: 2, max: 4 }
        fields:
          - { name: valeur, label: Chiffre, type: string }
          - { name: libelle, label: Libellé, type: string }
          - { name: detail, label: Précision, type: string }

      - name: apropos
        label: Section « Le club »
        type: object
        fields:
          - { name: eyebrow, label: Petit titre, type: string }
          - { name: titre, label: Titre, type: string }
          - { name: paragraphes, label: Paragraphes, type: text, list: true }
          - name: points
            label: Points forts
            type: object
            list: true
            fields:
              - { name: titre, label: Titre, type: string }
              - { name: texte, label: Texte, type: text }
          - name: images
            label: Photos du club (1 = image fixe, plusieurs = diaporama)
            type: object
            list: true
            fields:
              - { name: src, label: Photo, type: image }
              - { name: alt, label: Description (accessibilité), type: string }
          - name: citation
            label: Citation
            type: object
            fields:
              - { name: texte, label: Citation, type: text }
              - { name: auteur, label: Auteur, type: string }

  # -------------------------------------------------------------- TRIATHLON
  - name: triathlon
    label: Triathlon de Biscarrosse
    type: file
    path: src/data/triathlon.json
    icon: bike
    fields:
      - { name: nom, label: Nom de l'épreuve, type: string }
      - { name: edition, label: Édition (ex. Édition 2026), type: string }
      - { name: accroche, label: Accroche, type: text }
      - { name: date, label: Date, type: date, options: { format: yyyy-MM-dd } }
      - { name: heure, label: Heure de départ (ex. 9h00), type: string }
      - { name: lieu, label: Lieu / départ, type: string }
      - name: formats
        label: Formats et distances
        type: object
        list: true
        fields:
          - { name: nom, label: Nom du format (ex. Format S), type: string }
          - name: distances
            label: Distances par discipline
            type: object
            list: true
            fields:
              - name: discipline
                label: Discipline
                type: select
                options: { values: [natation, velo, course] }
              - { name: valeur, label: Distance (ex. 750 m), type: string }
          - { name: detail, label: Détail du format, type: text }
          - { name: prix, label: Tarif (ex. 35 €), type: string }
      - { name: parcours, label: Parcours, type: text }
      - { name: tarifs, label: Tarifs d'inscription, type: text }
      - { name: lien_inscription, label: Lien d'inscription, type: string }
      - { name: reglement, label: "Règlement (lien PDF)", type: string }
      - { name: retrait_dossards, label: Retrait des dossards, type: text }
      - { name: ravitaillements, label: Ravitaillements, type: text }
      - { name: conditions, label: Conditions de participation, type: text }
      - { name: contact, label: Contact spécifique (vide = e-mail du club), type: string }
      - name: seo
        label: Référencement et partage
        type: object
        fields:
          - { name: titre, label: Titre de l'onglet, type: string }
          - { name: description, label: "Description (Google, réseaux)", type: text }
          - { name: image, label: Image de partage (1200×630), type: image }

  # ---------------------------------------------------------------- SWIMRUN
  - name: swimrun
    label: Swimrun du lac et des pins
    type: file
    path: src/data/swimrun.json
    icon: waves
    fields:
      - { name: nom, label: Nom de l'épreuve, type: string }
      - { name: edition, label: Édition (ex. Édition 2026), type: string }
      - { name: accroche, label: Accroche, type: text }
      - { name: date, label: Date, type: date, options: { format: yyyy-MM-dd } }
      - { name: heure, label: Heure de départ (ex. 9h00), type: string }
      - { name: lieu, label: Lieu / départ, type: string }
      - name: formats
        label: Formats et distances
        type: object
        list: true
        fields:
          - { name: nom, label: Nom du format (ex. Format S), type: string }
          - name: distances
            label: Distances par discipline
            type: object
            list: true
            fields:
              - name: discipline
                label: Discipline
                type: select
                options: { values: [natation, velo, course] }
              - { name: valeur, label: Distance (ex. 750 m), type: string }
          - { name: detail, label: Détail du format, type: text }
          - { name: prix, label: Tarif (ex. 35 €), type: string }
      - { name: parcours, label: Parcours, type: text }
      - { name: materiel, label: Matériel obligatoire, type: text }
      - { name: tarifs, label: Tarifs d'inscription, type: text }
      - { name: lien_inscription, label: Lien d'inscription, type: string }
      - { name: reglement, label: "Règlement (lien PDF)", type: string }
      - { name: retrait_dossards, label: Retrait des dossards, type: text }
      - { name: ravitaillements, label: Ravitaillements, type: text }
      - { name: conditions, label: Conditions de participation, type: text }
      - { name: contact, label: Contact spécifique (vide = e-mail du club), type: string }
      - name: seo
        label: Référencement et partage
        type: object
        fields:
          - { name: titre, label: Titre de l'onglet, type: string }
          - { name: description, label: "Description (Google, réseaux)", type: text }
          - { name: image, label: Image de partage (1200×630), type: image }

  # --------------------------------------------------------------- RÉGLAGES
  - name: reglages
    label: Réglages du site
    type: file
    path: src/data/site.json
    icon: settings
    fields:
      - { name: nom, label: Nom du club, type: string }
      - { name: nom_court, label: Nom court, type: string }
      - { name: baseline, label: Baseline, type: string }
      - { name: ville, label: Ville, type: string }
      - { name: affiliation, label: Affiliation, type: string }
      - { name: email, label: Courriel, type: string }
      - { name: telephone, label: Téléphone, type: string }
      - name: adresse
        label: Adresse
        type: object
        fields:
          - { name: lignes, label: Lignes d'adresse, type: string, list: true }
          - { name: lien_maps, label: Lien vers une carte, type: string }
      - name: reseaux
        label: Réseaux sociaux
        type: object
        list: true
        fields:
          - name: nom
            label: Réseau
            type: select
            options:
              values: [Facebook, Instagram, Strava, YouTube]
          - { name: url, label: Lien, type: string }
      - name: nav
        label: Menu de navigation
        type: object
        list: true
        fields:
          - { name: libelle, label: Libellé, type: string }
          - { name: lien, label: Lien (ancre ou URL), type: string }
      - name: annonce
        label: Bandeau d'annonce
        type: object
        fields:
          - { name: actif, label: Afficher le bandeau, type: boolean }
          - { name: texte, label: Texte, type: string }
          - { name: libelle_lien, label: Libellé du lien, type: string }
          - { name: lien, label: Lien, type: string }
